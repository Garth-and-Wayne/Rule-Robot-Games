<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rule Robots — Practice Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1f3b; --paper:#f6f4ec; --teal:#1fb6a8; --amber:#f6b942; --lav:#8b7ff0; --card:#ffffff; --line:#e3ded0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Nunito',sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(139,127,240,.18), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(31,182,168,.18), transparent 45%),
      var(--paper);
    min-height:100vh; padding:32px 16px;
  }
  .wrap{max-width:520px; margin:0 auto; text-align:center;}
  h1{font-family:'Baloo 2',sans-serif; font-size:clamp(26px,7vw,36px); margin:10px 0 4px;}
  .tag{color:#5b5b6b; margin-bottom:28px;}
  .bot{font-size:40px;}
  .card{
    display:block; background:var(--card); border:2px solid var(--line); border-radius:20px;
    padding:20px; margin-bottom:16px; text-decoration:none; color:var(--ink);
    box-shadow:0 3px 0 var(--line); transition:transform .12s ease;
  }
  .card:active{transform:translateY(2px);}
  .card .icon{font-size:36px; margin-bottom:6px;}
  .card h2{font-family:'Baloo 2'; margin:4px 0 4px; font-size:20px;}
  .card p{margin:0; font-size:14px; color:#666;}
</style>
</head>
<body>
<div class="wrap">
  <div class="bot">🤖</div>
  <h1>Rule Robots</h1>
  <div class="tag">Pick a game to play!</div>

  <a class="card" href="rule-robots.html">
    <div class="icon">🔟</div>
    <h2>Number Lab</h2>
    <p>Making ten, number rules, and skip counting.</p>
  </a>

  <a class="card" href="word-lab.html">
    <div class="icon">📝</div>
    <h2>Word Lab</h2>
    <p>Subjects, verbs, pronouns, and nouns.</p>
  </a>
</div>
</body>
</html>
